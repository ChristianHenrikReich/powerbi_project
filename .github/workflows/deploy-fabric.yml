name: Validate and deploy Power BI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-deploy.txt
      - run: npm ci
      - name: Validate deployment automation and project structure
        run: python -m unittest discover -s tests -v
      - name: Validate PBIR
        run: npm run validate:report

  deploy:
    name: Ensure all workspaces and deploy production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment:
      name: fabric-prd
    concurrency:
      group: fabric-reporting-prd
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REPORTING_DEV_WORKSPACE_ID: ${{ vars.REPORTING_DEV_WORKSPACE_ID }}
      REPORTING_TST_WORKSPACE_ID: ${{ vars.REPORTING_TST_WORKSPACE_ID }}
      REPORTING_PRD_WORKSPACE_ID: ${{ vars.REPORTING_PRD_WORKSPACE_ID || vars.REPORTING_WORKSPACE_ID }}
      REPORTING_DEV_CAPACITY_ID: ${{ vars.REPORTING_DEV_CAPACITY_ID || vars.REPORTING_CAPACITY_ID }}
      REPORTING_TST_CAPACITY_ID: ${{ vars.REPORTING_TST_CAPACITY_ID || vars.REPORTING_CAPACITY_ID }}
      REPORTING_PRD_CAPACITY_ID: ${{ vars.REPORTING_PRD_CAPACITY_ID || vars.REPORTING_CAPACITY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - run: python -m pip install -r requirements-deploy.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Resolve or create dev, tst, and prd workspaces
        run: >-
          python -m scripts.setup_workspaces --workspace reporting
          --environment all --output .deploy\resolved-solution.yml
      - name: Deploy model and consuming report to prd, verify binding, and refresh
        run: >-
          python -m scripts.deploy --workspace reporting
          --environment prd --config .deploy\resolved-solution.yml --refresh
